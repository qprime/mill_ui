name: Mill UI Native CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build and install project (native extension)
        run: pip install .

      - name: Run unit tests
        run: pytest skills/mill_ui/tests/unit
