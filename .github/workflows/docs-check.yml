name: docs-check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: README sweeper dry-run
        run: python tools/docs/sweep_readmes.py --dry-run

      - name: README sweeper check
        run: python tools/docs/sweep_readmes.py --check

      - name: Run docs sweeper tests
        run: python -m pytest -q tests/test_docs_sweeper.py
