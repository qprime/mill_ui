name: Mill UI Python Suite

on:
  push:
    paths:
      - "skills/mill_ui/**"
      - ".github/workflows/mill-ui-python.yml"
  pull_request:
    paths:
      - "skills/mill_ui/**"
      - ".github/workflows/mill-ui-python.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run pytest
        run: pytest -q skills/mill_ui/tests
