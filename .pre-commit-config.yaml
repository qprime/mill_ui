repos:
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-shapely
          - hypothesis>=6.0
          - pytest>=9.0
          - ruamel.yaml>=0.19
          - mcp[cli]>=1.25
        pass_filenames: false
        args: [.]
