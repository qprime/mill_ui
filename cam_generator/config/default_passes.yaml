# Toolpass configuration for relief carving (real tools)

coarse:
  tool_diameter: 6.35     # 1/4"
  stepover: 3.0
  z_scale: 2.0
  tool_type: flat         # Rapid roughing

medium:
  tool_diameter: 3.175    # 1/8"
  stepover: 1.5
  z_scale: 2.0
  tool_type: flat         # Optional pre-finish

fine:
  tool_diameter: 3.175    # 1/8"
  stepover: 0.4
  z_scale: 2.0
  tool_type: ball         # Detail surface
