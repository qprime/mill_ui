    <text x="439.0" y="200.0" class="dimension-text" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 439.0 200.0)">140.0mm</text>
  </g>
  <g id="NOTES" class="notes">
    <text x="20" y="280.0" class="notes" font-weight="bold">NOTES</text>
