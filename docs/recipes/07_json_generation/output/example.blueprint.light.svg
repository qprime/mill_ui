    <polygon points="420.0,100 417.0,103.0 423.0,103.0" fill="#5ab9ea" />
    <polygon points="420.0,300.0 417.0,297.0 423.0,297.0" fill="#5ab9ea" />
    <text x="425.0" y="200.0" class="dimension-text" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 425.0 200.0)">200.0mm</text>
    <line x1="140.0" y1="130.0" x2="140.0" y2="66.0" stroke="#5ab9ea" stroke-width="1" />
    <line x1="360.0" y1="130.0" x2="360.0" y2="66.0" stroke="#5ab9ea" stroke-width="1" />
    <line x1="140.0" y1="66.0" x2="360.0" y2="66.0" stroke="#5ab9ea" stroke-width="1" />
    <polygon points="140.0,66.0 143.0,63.0 143.0,69.0" fill="#5ab9ea" />
    <polygon points="360.0,66.0 357.0,63.0 357.0,69.0" fill="#5ab9ea" />
    <text x="250.0" y="61.0" class="dimension-text" text-anchor="middle" dominant-baseline="middle">220.0mm</text>
    <line x1="360.0" y1="130.0" x2="434.0" y2="130.0" stroke="#5ab9ea" stroke-width="1" />
    <line x1="360.0" y1="270.0" x2="434.0" y2="270.0" stroke="#5ab9ea" stroke-width="1" />
    <line x1="434.0" y1="130.0" x2="434.0" y2="270.0" stroke="#5ab9ea" stroke-width="1" />
    <polygon points="434.0,130.0 431.0,133.0 437.0,133.0" fill="#5ab9ea" />
