    <line x1="320.0" y1="38" x2="335.0" y2="38" stroke="#e8e8e8" stroke-width="2" />
    <text x="340.0" y="41" class="legend">Profile Cuts</text>
    <rect x="320.0" y="51" width="15.0" height="8" stroke="#6496c8" stroke-width="1.5" fill="#6496c8" fill-opacity="0.2" />
    <text x="340.0" y="57" class="legend">Pocket Regions</text>
    <line x1="320.0" y1="70" x2="335.0" y2="70" stroke="#e8e8e8" stroke-width="1.5" />
