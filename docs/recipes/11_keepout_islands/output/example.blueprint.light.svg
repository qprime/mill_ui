<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600.0 600.0" width="600.0mm" height="600.0mm">
  <style>
        .sheet-outline { stroke: #333333; stroke-width: 1; fill: none; stroke-dasharray: 2,2; }
        .profile-cuts { stroke: #e8e8e8; stroke-width: 2; fill: none; }
        .pocket-regions { stroke: #6496c8; stroke-width: 1.5; fill: #6496c8; fill-opacity: 0.2; }
        .holes { stroke: #e8e8e8; stroke-width: 1.5; fill: none; }
        .engrave-paths { stroke: #888888; stroke-width: 1; fill: none; stroke-dasharray: 4,4; }
        .construction { stroke: #333333; stroke-width: 0.5; fill: none; stroke-dasharray: 2,2; }
        .dimensions { stroke: #5ab9ea; stroke-width: 1; fill: none; }
        .dimension-text { fill: #5ab9ea; font-family: monospace; font-size: 12px; }
        .notes { fill: #cccccc; font-family: monospace; font-size: 10px; }
        .legend { fill: #cccccc; font-family: monospace; font-size: 10px; }
    </style>
  <rect x="0" y="0" width="600.0" height="600.0" fill="#1a1a1a" />
  <g id="SHEET_OUTLINE" class="sheet-outline">
    <rect x="100" y="100" width="400.0" height="400.0" />
  </g>
  <g id="PROFILE_CUTS" class="profile-cuts" />
  <g id="POCKET_REGIONS" class="pocket-regions">
    <rect x="100.0" y="100.0" width="400.0" height="400.0" />
  </g>
  <g id="ENGRAVE_PATHS" class="engrave-paths" />
  <g id="HOLES" class="holes" />
  <g id="CONSTRUCTION" class="construction" />
  <g id="DIMENSIONS" class="dimensions">
    <line x1="100" y1="100" x2="100" y2="80.0" stroke="#5ab9ea" stroke-width="1" />
    <line x1="500.0" y1="100" x2="500.0" y2="80.0" stroke="#5ab9ea" stroke-width="1" />
    <line x1="100" y1="80.0" x2="500.0" y2="80.0" stroke="#5ab9ea" stroke-width="1" />
    <polygon points="100,80.0 103.0,77.0 103.0,83.0" fill="#5ab9ea" />
    <polygon points="500.0,80.0 497.0,77.0 497.0,83.0" fill="#5ab9ea" />
    <text x="300.0" y="75.0" class="dimension-text" text-anchor="middle" dominant-baseline="middle">400.0mm</text>
    <line x1="500.0" y1="100" x2="520.0" y2="100" stroke="#5ab9ea" stroke-width="1" />
    <line x1="500.0" y1="500.0" x2="520.0" y2="500.0" stroke="#5ab9ea" stroke-width="1" />
    <line x1="520.0" y1="100" x2="520.0" y2="500.0" stroke="#5ab9ea" stroke-width="1" />
    <polygon points="520.0,100 517.0,103.0 523.0,103.0" fill="#5ab9ea" />
    <polygon points="520.0,500.0 517.0,497.0 523.0,497.0" fill="#5ab9ea" />
    <text x="530.0" y="300.0" class="dimension-text" text-anchor="middle" dominant-baseline="middle">400.0mm</text>
  </g>
  <g id="NOTES" class="notes">
    <text x="20" y="480.0" class="notes" font-weight="bold">NOTES</text>
    <text x="20" y="492.0" class="notes">Sheet: 400.0 × 400.0 × 19.0mm</text>
    <text x="20" y="504.0" class="notes">Features: 1 pocket</text>
    <text x="20" y="516.0" class="notes">Depths:</text>
    <text x="30" y="528.0" class="notes">• pocket: 6.0</text>
  </g>
  <g id="TITLE_BLOCK" class="title-block">
    <text x="20" y="20" class="notes" font-weight="bold" font-size="14px">BLUEPRINT PROOF DRAWING</text>
    <text x="20" y="34" class="notes" font-size="9px">Units: millimeters (mm)</text>
  </g>
  <g id="LEGEND" class="legend">
    <text x="420.0" y="20" class="legend" font-weight="bold">LEGEND</text>
    <line x1="420.0" y1="38" x2="435.0" y2="38" stroke="#e8e8e8" stroke-width="2" />
    <text x="440.0" y="41" class="legend">Profile Cuts</text>
    <rect x="420.0" y="51" width="15.0" height="8" stroke="#6496c8" stroke-width="1.5" fill="#6496c8" fill-opacity="0.2" />
    <text x="440.0" y="57" class="legend">Pocket Regions</text>
    <line x1="420.0" y1="70" x2="435.0" y2="70" stroke="#e8e8e8" stroke-width="1.5" />
    <text x="440.0" y="73" class="legend">Holes</text>
    <line x1="420.0" y1="86" x2="435.0" y2="86" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
    <text x="440.0" y="89" class="legend">Engraves</text>
    <line x1="420.0" y1="102" x2="435.0" y2="102" stroke="#5ab9ea" stroke-width="1" />
    <text x="440.0" y="105" class="legend">Dimensions</text>
  </g>
</svg>