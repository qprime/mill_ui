Sheet:
  width: 700mm
  height: 260mm
  thickness: 12mm
  material: mdf
children:
- Rect:
    id: hypotrochoid
    at:
      x: 120mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Curve:
        type: spirograph
        fixed_radius: 60mm
        rolling_radius: 21mm
        pen_offset: 15mm
        depth: 0.3mm
        size: 180mm

- Rect:
    id: deltoid
    at:
      x: 350mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Curve:
        type: spirograph
        fixed_radius: 60mm
        rolling_radius: 20mm
        pen_offset: 20mm
        depth: 0.3mm
        size: 180mm

- Rect:
    id: epitrochoid
    at:
      x: 580mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Curve:
        type: spirograph
        fixed_radius: 40mm
        rolling_radius: 10mm
        pen_offset: 8mm
        mode: outside
        depth: 0.3mm
        size: 180mm
