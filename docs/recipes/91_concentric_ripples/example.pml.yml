Sheet:
  width: 700mm
  height: 260mm
  thickness: 12mm
  material: mdf
children:
- Rect:
    id: engraved_square
    at:
      x: 120mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - ConcentricBorder:
        count: 8
        step: 10mm
        mode: engrave
        depth: 0.5mm

- Rect:
    id: island_ripples
    at:
      x: 350mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Subtract:
        inner_inset: 60mm
        children:
        - ConcentricBorder:
            count: 3
            step: 8mm
            join: round
            groove: 3mm
            depth: 2mm

- Circle:
    id: engraved_disc
    diameter: 200mm
    at:
      x: 580mm
      y: 130mm
      width: 200mm
      height: 200mm
    feature:
      type: profile
      side: outside
      depth: through
    children:
    - ConcentricBorder:
        count: 9
        step: 10mm
        mode: engrave
        depth: 0.5mm
