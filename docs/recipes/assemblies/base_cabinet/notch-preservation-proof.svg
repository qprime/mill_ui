  <g id="NOTCH_PRESERVATION_PROOF" class="notch-preservation-proof">
    <text x="20.000" y="28.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-size="18px" font-weight="bold" font-family="sans-serif">Original assembly cuts survive resolution: actual G-code proof</text>
    <text x="20.000" y="53.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Open carcass sides · 560 × 720 × 18 mm each · 75 × 100 mm toe notch · no caps or joint interfaces</text>
    <text x="20.000" y="88.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-size="18px" font-weight="bold" font-family="sans-serif">BEFORE: requested notch disappears</text>
    <text x="500.000" y="88.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-size="18px" font-weight="bold" font-family="sans-serif">AFTER: original notch is machined once</text>
