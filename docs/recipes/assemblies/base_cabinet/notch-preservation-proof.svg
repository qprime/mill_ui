    <text x="300.000" y="820.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">The 6.35 mm cutter leaves its normal rounded inside corner.</text>
    <text x="300.000" y="850.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Nominal blanks remain 560 × 720 mm.</text>
    <text x="300.000" y="880.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Both mirrored side profiles are checked from emitted NC.</text>
    <text x="300.000" y="920.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">The full cabinet also keeps one source notch per side,</text>
    <text x="300.000" y="950.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">rather than repeating it for each of its four interfaces.</text>
    <text x="20.000" y="1080.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">The same reducer preserves original dados and appends each new joint cut. Explicit requests retain their multiplicity.</text>
    <text x="20.000" y="1106.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Existing 33 recipe outputs are byte-identical. This fixture exercises the previously missing zero-interface case.</text>
    <text x="20.000" y="1140.000" text-anchor="start" dominant-baseline="middle" fill="#475569" stroke="none" font-size="11px" font-family="sans-serif">Computational verification only. Source/NC hashes and measurements: notch-preservation-measurements.json.</text>
