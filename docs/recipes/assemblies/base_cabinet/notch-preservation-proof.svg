    <text x="40.000" y="720.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Toe region remains solid: about 7,500 mm².</text>
    <text x="520.000" y="720.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Toe is open; overhang and rear leg remain.</text>
    <text x="20.000" y="765.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-size="18px" font-weight="bold" font-family="sans-serif">Inside-corner detail from the actual cutter sweep</text>
