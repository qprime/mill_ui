    <line x1="1108.0" y1="-18.0" x2="1123.0" y2="-18.0" stroke="#0f172a" stroke-width="1" />
    <text x="1128.0" y="-15.0" stroke="#0f172a" fill="none" stroke-width="1">Dimensions</text>
  </g>
  <g id="NOTES" class="notes">
    <text x="20.0" y="995.0" stroke="#0f172a" fill="none" stroke-width="1" font-weight="bold">NOTES</text>
  </g>
</svg>