<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10.000 -50.000 1250.000 1095.000" width="1250.0mm" height="1095.0mm">
  <style>.requested { fill: #dbeafe; stroke: #1d4ed8; stroke-width: .7; }
.legacy { fill: #fecaca; stroke: #991b1b; stroke-width: .7; }
.guide { fill: none; stroke: #64748b; stroke-width: .7; stroke-dasharray: 3,2; }
.heading { fill: #0f172a; stroke: none; font-size: 18px; font-weight: bold; font-family: sans-serif; }
.caption { fill: #334155; stroke: none; font-size: 13px; font-family: sans-serif; }
.small { fill: #475569; stroke: none; font-size: 11px; font-family: sans-serif; }
.error { fill: #991b1b; stroke: none; font-size: 14px; font-family: sans-serif; }</style>
  <rect x="-10" y="-50.0" width="1250.0" height="1095.0" fill="#fff" />
  <g id="NOTCH_TOPOLOGY_REJECTION" class="notch-topology-rejection">
    <text x="20.000" y="28.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-size="18px" font-weight="bold" font-family="sans-serif">Invalid notch results: reject the request before machining</text>
    <text x="20.000" y="54.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Two deliberately invalid PML finger layouts · front blank 30 × 50 × 18 mm · same shared notch builder</text>
    <text x="35.000" y="100.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Requested remainder</text>
    <text x="275.000" y="100.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Legacy profile</text>
    <text x="530.000" y="100.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Current CLI result</text>
    <text x="20.000" y="125.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-size="18px" font-weight="bold" font-family="sans-serif">A · Cuts split the front into two pieces</text>
    <path d="M 165.0000,360.0000 L 165.0000,160.0000 L 45.0000,160.0000 L 45.0000,360.0000 L 165.0000,360.0000 Z" fill="none" stroke="#64748b" stroke-width=".7" stroke-dasharray="3,2" fill-rule="evenodd" />
    <path d="M 165.0000,360.0000 L 45.0000,360.0000 L 45.0000,293.3333 L 93.0000,293.3333 L 117.0000,293.3333 L 165.0000,293.3333 L 165.0000,360.0000 Z M 45.0000,160.0000 L 165.0000,160.0000 L 165.0000,226.6667 L 117.0000,226.6667 L 93.0000,226.6667 L 45.0000,226.6667 L 45.0000,160.0000 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width=".7" fill-rule="evenodd" />
    <path d="M 405.0000,360.0000 L 405.0000,160.0000 L 285.0000,160.0000 L 285.0000,360.0000 L 405.0000,360.0000 Z" fill="none" stroke="#64748b" stroke-width=".7" stroke-dasharray="3,2" fill-rule="evenodd" />
    <path d="M 285.0000,360.0000 L 285.0000,293.3320 L 405.0000,293.3320 L 405.0000,360.0000 L 402.4360,360.0000 L 285.0000,360.0000 Z" fill="#fecaca" stroke="#991b1b" stroke-width=".7" fill-rule="evenodd" />
    <text x="35.000" y="385.000" text-anchor="start" dominant-baseline="middle" fill="#475569" stroke="none" font-size="11px" font-family="sans-serif">Two 500 mm² fragments</text>
    <text x="275.000" y="385.000" text-anchor="start" dominant-baseline="middle" fill="#475569" stroke="none" font-size="11px" font-family="sans-serif">One fragment selected</text>
    <text x="530.000" y="200.000" text-anchor="start" dominant-baseline="middle" fill="#991b1b" stroke="none" font-size="14px" font-family="sans-serif">BUILD REJECTED · no G-code</text>
    <text x="530.000" y="235.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Notched panel 'front':</text>
    <text x="530.000" y="260.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Notches split the 30 x 50mm panel</text>
    <text x="530.000" y="284.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">into 2 disconnected pieces.</text>
    <text x="530.000" y="315.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Expected one connected panel.</text>
    <text x="530.000" y="350.000" text-anchor="start" dominant-baseline="middle" fill="#475569" stroke="none" font-size="11px" font-family="sans-serif">Exit 1; stale programs removed.</text>
    <text x="20.000" y="475.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-size="18px" font-weight="bold" font-family="sans-serif">B · Cuts remove the entire front</text>
    <path d="M 165.0000,710.0000 L 165.0000,510.0000 L 45.0000,510.0000 L 45.0000,710.0000 L 165.0000,710.0000 Z" fill="none" stroke="#64748b" stroke-width=".7" stroke-dasharray="3,2" fill-rule="evenodd" />
    <path d="M 405.0000,710.0000 L 405.0000,510.0000 L 285.0000,510.0000 L 285.0000,710.0000 L 405.0000,710.0000 Z" fill="none" stroke="#64748b" stroke-width=".7" stroke-dasharray="3,2" fill-rule="evenodd" />
    <path d="M 402.4360,710.0000 L 285.0000,710.0000 L 285.0000,510.0000 L 405.0000,510.0000 L 405.0000,710.0000 L 402.4360,710.0000 Z" fill="#fecaca" stroke="#991b1b" stroke-width=".7" fill-rule="evenodd" />
    <text x="35.000" y="735.000" text-anchor="start" dominant-baseline="middle" fill="#475569" stroke="none" font-size="11px" font-family="sans-serif">No material remains</text>
    <text x="275.000" y="735.000" text-anchor="start" dominant-baseline="middle" fill="#475569" stroke="none" font-size="11px" font-family="sans-serif">Full rectangle restored</text>
    <text x="530.000" y="550.000" text-anchor="start" dominant-baseline="middle" fill="#991b1b" stroke="none" font-size="14px" font-family="sans-serif">BUILD REJECTED · no G-code</text>
    <text x="530.000" y="585.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Notched panel 'front':</text>
    <text x="530.000" y="610.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Notches remove the entire 30 x 50mm panel.</text>
    <text x="530.000" y="665.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Expected one connected panel.</text>
    <text x="530.000" y="700.000" text-anchor="start" dominant-baseline="middle" fill="#475569" stroke="none" font-size="11px" font-family="sans-serif">Exit 1; stale programs removed.</text>
    <text x="20.000" y="790.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-size="18px" font-weight="bold" font-family="sans-serif">Evidence and scope</text>
    <text x="20.000" y="820.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Red outlines are reconstructed from the actual legacy profile NC with its 6.35 mm cutter.</text>
    <text x="20.000" y="846.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Those legacy jobs already reported separate design errors (exit 3), while still writing programs.</text>
    <text x="20.000" y="872.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">The corrected builder rejects these layouts during resolution, before any current machining program is written.</text>
    <text x="20.000" y="912.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-size="13px" font-family="sans-serif">Valid thin webs and connected clipped notches remain supported. Existing recipe outputs remain byte-identical.</text>
    <text x="20.000" y="946.000" text-anchor="start" dominant-baseline="middle" fill="#475569" stroke="none" font-size="11px" font-family="sans-serif">Fixture, input/NC hashes and actual error messages: notch-topology-measurements.json.</text>
  </g>
  <g id="TITLE_BLOCK" class="title-block">
    <text x="0.0" y="-36.0" stroke="#0f172a" fill="none" stroke-width="1">BLUEPRINT PROOF DRAWING</text>
    <text x="0.0" y="-22.0" stroke="#0f172a" fill="none" stroke-width="1">Units: millimeters (mm)</text>
  </g>
  <g id="LEGEND" class="legend">
