    <text x="205.000" y="612.875" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">864 × 252.5 mm clear</text>
    <text x="205.000" y="477.625" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">864 × 252.5 mm clear</text>
    <text x="205.000" y="342.375" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">864 × 252.5 mm clear</text>
    <text x="205.000" y="207.125" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">864 × 252.5 mm clear</text>
    <text x="20.000" y="728.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">Two sides 300×1100; top, bottom and three shelves 882×300 mm.</text>
    <text x="575.000" y="88.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-family="sans-serif" font-size="18px" font-weight="bold">Shelf-to-side engagement, enlarged</text>
    <path d="M 710.0000,179.0000 L 665.0000,179.0000 L 665.0000,270.0000 L 710.0000,270.0000 L 710.0000,310.0000 L 620.0000,310.0000 L 620.0000,175.0000 L 710.0000,175.0000 L 710.0000,179.0000 Z" fill="#b4c9ed" stroke="#334155" stroke-width=".65" fill-rule="evenodd" />
    <path d="M 710.0025,292.5000 L 710.0025,202.5000 L 795.0000,202.5000 L 795.0000,292.5000 L 710.0025,292.5000 Z" fill="#f6d17e" stroke="#334155" stroke-width=".65" fill-rule="evenodd" />
    <text x="575.000" y="135.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">BEFORE: 864 mm board only reaches side face.</text>
    <text x="575.000" y="338.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">Old cuts also placed the shelf level 4.5 mm too high.</text>
    <path d="M 710.0000,431.5000 L 665.0000,431.5000 L 665.0000,522.5000 L 710.0000,522.5000 L 710.0000,540.0000 L 620.0000,540.0000 L 620.0000,405.0000 L 710.0000,405.0000 L 710.0000,431.5000 Z" fill="#b4c9ed" stroke="#334155" stroke-width=".65" fill-rule="evenodd" />
    <path d="M 665.0025,522.5000 L 665.0025,432.5000 L 795.0000,432.5000 L 795.0000,522.5000 L 665.0025,522.5000 Z" fill="#f6d17e" stroke="#334155" stroke-width=".65" fill-rule="evenodd" />
    <text x="575.000" y="365.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">AFTER: 882 mm board enters 9 mm groove.</text>
    <text x="575.000" y="568.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">Shelf bottom at Z270.5; four equal clear openings.</text>
    <text x="575.000" y="645.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-family="sans-serif" font-size="18px" font-weight="bold">Verified retained material</text>
    <text x="575.000" y="675.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">612 depth slices: zero part interference.</text>
    <text x="575.000" y="700.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">All seven retained blank spans match nominal sizes.</text>
    <text x="575.000" y="725.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">Profiles: 3.175 mm tool, 18.2 mm depth.</text>
    <text x="20.000" y="779.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">Grooves: actual 12.7 mm tool, 9 mm depth. Assembly sections use the emitted cutter sweeps, not intended rectangles.</text>
    <text x="20.000" y="804.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">Measurements use 0.004 mm NC rounding tolerance. This is computational evidence; no physical assembly test has been performed.</text>
    <text x="20.000" y="829.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">Before joint view uses historical cuts, centering the old undersized shelf in the opening. Source NC hashes are saved with measurements.</text>
