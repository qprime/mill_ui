  <rect x="-10" y="-50.0" width="1260.0" height="970.0" fill="#fff" />
  <g id="CARCASS_SHELF_FIT_PROOF" class="carcass-shelf-fit-proof">
    <text x="20.000" y="28.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-family="sans-serif" font-size="18px" font-weight="bold">Bookcase: a carcass with three full-width fixed shelves</text>
    <text x="20.000" y="52.000" text-anchor="start" dominant-baseline="middle" fill="#334155" stroke="none" font-family="sans-serif" font-size="13px">900 × 300 × 1100 mm outside dimensions · 18 mm stock · no vertical dividers · no back · 3 sheets</text>
    <text x="20.000" y="88.000" text-anchor="start" dominant-baseline="middle" fill="#0f172a" stroke="none" font-family="sans-serif" font-size="18px" font-weight="bold">Front section from the emitted cutting programs</text>
