project: raised_panel_doors

Sheet:
  working_width: 1080mm
  working_height: 780mm
  margin: 10mm
  thickness: 19mm
  material: mdf

children:
  - Rect:
      id: four_panel_door
      label: Four-Panel Raised Door
      at:
        x: 270mm
        y: 390mm
        width: 450mm
        height: 700mm
      children:
        - Profile:
            side: outside
            depth: through
            tab_count: 4
            tab_height: 3mm
        - Frame:
            width: 60mm
            children:
              - SplitHorizontal:
                  count: 2
                  gap: 50mm
                  children:
                    - SplitVertical:
                        count: 2
                        gap: 50mm
                        children:
                          - RaisedPanel:
                              profile: gutter
                              v_angle: 90
                              border_width: 25mm
                              border_depth: 6mm
                              field_depth: 2mm
                          - RaisedPanel:
                              profile: gutter
                              v_angle: 60
                              border_width: 25mm
                              border_depth: 6mm
                              field_depth: 2mm
                    - SplitVertical:
                        count: 2
                        gap: 50mm
                        children:
                          - RaisedPanel:
                              profile: v_groove
                              v_angle: 90
                              border_depth: 6mm
                              field_depth: 0mm
                          - RaisedPanel:
                              profile: v_groove
                              v_angle: 60
                              border_depth: 6mm
                              field_depth: 2mm

  - AtPosition:
      x: 810mm
      y: 390mm
      width: 450mm
      height: 700mm
      child:
        Arch:
          id: arch_door
          label: Cathedral Arch Raised Door
          width: 450mm
          height: 700mm
          radius: 175mm
          children:
            - Profile:
                side: outside
                depth: through
                tab_count: 4
                tab_height: 3mm
            - Frame:
                width: 60mm
                children:
                  - RaisedPanel:
                      profile: gutter
                      v_angle: 90
                      border_width: 25mm
                      border_depth: 6mm
                      field_depth: 2mm
