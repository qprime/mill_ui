project: frames_and_trays

Sheet:
  physical_width: 1000mm
  physical_height: 700mm
  thickness: 19mm
  margin: 10mm

children:
  - Rect:
      id: picture_frame
      label: "Picture Frame"
      at: {x: 150mm, y: 490mm, width: 260mm, height: 340mm}
      children:
        - Profile: {side: outside, depth: through}
        - Inset:
            distance: 60mm
            children:
              - Profile: {side: inside, depth: through}
              - Chamfer: {width: 5mm, depth: 5mm}

  - RoundedRect:
      id: serving_tray
      label: "Serving Tray"
      radius: 30mm
      at: {x: 470mm, y: 560mm, width: 300mm, height: 200mm}
      children:
        - Profile: {side: outside, depth: through}
        - Inset:
            distance: 20mm
            children:
              - RoundedRect:
                  id: serving_tray_floor
                  radius: 10mm
                  children:
                    - Pocket: {depth: 12mm}

  - Ellipse:
      id: oval_tray
      label: "Oval Tray"
      at: {x: 810mm, y: 560mm, width: 280mm, height: 180mm}
      children:
        - Profile: {side: outside, depth: through}
        - Inset:
            distance: 20mm
            children:
              - Ellipse:
                  id: oval_tray_floor
                  children:
                    - Pocket: {depth: 12mm}

  - Polygon:
      id: pentagon_frame
      label: "Pentagon Frame"
      points:
        - [170mm, 300mm]
        - [36.85mm, 203.26mm]
        - [87.71mm, 46.74mm]
        - [252.29mm, 46.74mm]
        - [303.15mm, 203.26mm]
      children:
        - Profile: {side: outside, depth: through}
        - Shell:
            wall: 40mm
            interior: profile

  - AtPosition:
      x: 490mm
      y: 160mm
      width: 240mm
      height: 220mm
      child:
        Triangle:
          id: trivet
          label: "Trivet"
          base: 240mm
          height: 220mm
          children:
            - Profile: {side: outside, depth: through}
