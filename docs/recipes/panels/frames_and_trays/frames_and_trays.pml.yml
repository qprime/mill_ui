project: frames_and_trays

Sheet:
  physical_width: 1000mm
  physical_height: 700mm
  thickness: 19mm
  margin: 10mm

children:
  - Rect:
      id: picture_frame
      label: "Picture Frame"
      at: {x: 133.2mm, y: 446.46mm, width: 260mm, height: 340mm}
      children:
        - Profile: {side: outside, depth: through}
        - Inset:
            distance: 60mm
            children:
              - Profile: {side: inside, depth: through}
              - Chamfer: {width: 5mm, depth: 5mm}

  - RoundedRect:
      id: serving_tray
      label: "Serving Tray"
      radius: 30mm
      at: {x: 453.2mm, y: 516.46mm, width: 300mm, height: 200mm}
      children:
        - Profile: {side: outside, depth: through}
        - Inset:
            distance: 20mm
            children:
              - RoundedRect:
                  id: serving_tray_floor
                  radius: 10mm
                  children:
                    - Pocket: {depth: 12mm}

  - Ellipse:
      id: oval_tray
      label: "Oval Tray"
      at: {x: 793.2mm, y: 516.46mm, width: 280mm, height: 180mm}
      children:
        - Profile: {side: outside, depth: through}
        - Inset:
            distance: 20mm
            children:
              - Ellipse:
                  id: oval_tray_floor
                  children:
                    - Pocket: {depth: 12mm}

  - Polygon:
      id: pentagon_frame
      label: "Pentagon Frame"
      points:
        - [153.2mm, 256.46mm]
        - [20.05mm, 159.72mm]
        - [70.91mm, 3.2mm]
        - [235.49mm, 3.2mm]
        - [286.35mm, 159.72mm]
      children:
        - Profile: {side: outside, depth: through}
        - Shell:
            wall: 40mm
            interior: profile

  - AtPosition:
      x: 473.2mm
      y: 116.46mm
      width: 240mm
      height: 220mm
      child:
        Triangle:
          id: trivet
          label: "Trivet"
          base: 240mm
          height: 220mm
          children:
            - Profile: {side: outside, depth: through}
