project: pocket_with_island

Sheet:
  physical_width: 400mm
  physical_height: 400mm
  thickness: 19mm
  margin: 10mm

children:
  - Rect:
      id: medallion_panel
      label: "Medallion Panel"
      at: {x: 163.2mm, y: 163.2mm, width: 320mm, height: 320mm}
      children:
        - Profile: {side: outside, depth: through}
        - Inset:
            distance: 40mm
            children:
              - Rect:
                  id: recess
                  label: "Recess"
                  feature: {type: pocket, depth: 6mm}
                  children:
                    - Island:
                        id: medallion
                        children:
                          - Circle: {diameter: 100mm, at: {x: 163.2mm, y: 163.2mm}}
