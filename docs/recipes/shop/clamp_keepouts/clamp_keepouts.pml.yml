project: clamp_keepouts
Sheet:
  physical_width: 600mm
  physical_height: 400mm
  margin: 10mm
  thickness: 19mm
  material: mdf
children:
  - Rect:
      id: island_plate
      label: Island plate
      at: {x: 145.03mm, y: 105.03mm, width: 180mm, height: 120mm}
      feature: {type: pocket, depth: 6mm}
      children:
        - Profile: {side: outside, depth: through, tab_count: 4, tab_height: 3mm}
        - Island:
            id: boss
            children:
              - Rect: {at: {x: 145.03mm, y: 105.03mm, width: 60mm, height: 40mm}}
  - Rect:
      id: plain_plate
      label: Plain plate
      at: {x: 145.03mm, y: 265.03mm, width: 180mm, height: 120mm}
      feature: {type: profile, side: outside, depth: through, tab_count: 4, tab_height: 3mm}
  - Circle:
      id: disc
      label: Disc
      diameter: 200mm
      at: {x: 415.03mm, y: 185.03mm}
      feature: {type: profile, side: outside, depth: through, tab_count: 4, tab_height: 3mm}
  - Keepout:
      id: clamp_bottom_left
      children:
        - Rect: {at: {x: 20.03mm, y: 20.03mm, width: 40mm, height: 40mm}}
  - Keepout:
      id: clamp_bottom_right
      children:
        - Rect: {at: {x: 550.03mm, y: 20.03mm, width: 40mm, height: 40mm}}
  - Keepout:
      id: clamp_top_left
      children:
        - Rect: {at: {x: 20.03mm, y: 350.03mm, width: 40mm, height: 40mm}}
  - Keepout:
      id: clamp_top_right
      children:
        - Rect: {at: {x: 550.03mm, y: 350.03mm, width: 40mm, height: 40mm}}
  - Keepout:
      id: hold_down_screw
      children:
        - Circle: {at: {x: 285.03mm, y: 185.03mm}, diameter: 20mm}
