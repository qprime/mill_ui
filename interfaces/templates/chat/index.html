{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block content %}
<style>
  .chat-ledger-alert {
    margin-top: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    background: rgba(250, 204, 21, 0.12);
    border: 1px solid rgba(250, 204, 21, 0.35);
    color: #fef08a;
    font-size: 0.9rem;
  }
</style>
  <h1>Chat</h1>
  <form hx-post="/ask" hx-target="#responses" hx-swap="beforeend" class="stack">
    <textarea name="message" placeholder="Type your message..."></textarea>
    <div class="row">
      <input type="hidden" name="chat_id" value="">
      <button type="submit">Send</button>
      <span class="muted">Returns a small HTML fragment</span>
    </div>
  </form>
  <div id="chat-ledger-alert" class="chat-ledger-alert" hidden></div>
  <div id="responses" class="stack"></div>
  <script>
    (async () => {
      try {
        const res = await fetch('/api/system/ledger/status');
        if (!res.ok) return;
        const data = await res.json();
        if (!data.needs_compaction) return;
        const el = document.getElementById('chat-ledger-alert');
        if (!el) return;
        el.hidden = false;
        el.textContent = `Ledger at ${data.size_mb} MB (threshold ${data.threshold_mb} MB) – consider compaction.`;
      } catch (err) {
        console.warn('Ledger status unavailable', err);
      }
    })();
  </script>
{% endblock %}
