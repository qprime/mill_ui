<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Living Truth Partner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/ltp.css">
</head>
<body>
<div id="ltp-app" data-slug="{{ slug }}">
    <header class="ltp-bar">
        <div class="ltp-field">
            <label for="ltp-slug">Plan Slug</label>
            <input id="ltp-slug" type="text" placeholder="business_plan_q4" value="{{ slug }}">
            <button id="ltp-load">Open</button>
        </div>
        <div class="ltp-actions">
            <button id="ltp-record">Record</button>
            <button id="ltp-stop" disabled>Stop</button>
            <button id="ltp-upload">Upload Audio</button>
            <input id="ltp-file" type="file" accept="audio/*" hidden>
            <button id="ltp-tidy">Tidy Now</button>
            <button id="ltp-revise">Guided Revise</button>
            <button id="ltp-export-pdf">Export PDF</button>
            <button id="ltp-export-docx">Export DOCX</button>
        </div>
    </header>
    <main class="ltp-layout">
        <section class="ltp-panel" id="ltp-prompts-panel">
            <h2>Prompts</h2>
            <ul id="ltp-prompts"></ul>
            <h2>Suggestions</h2>
            <div id="ltp-suggestions"></div>
            <h2>Action Items</h2>
            <ul id="ltp-actions-list"></ul>
            <div class="ltp-field">
                <input id="ltp-action-input" type="text" placeholder="Add an action item">
                <button id="ltp-action-add">Add</button>
            </div>
        </section>
        <section class="ltp-panel" id="ltp-sections-panel">
            <h2>Sections</h2>
            <div id="ltp-sections"></div>
        </section>
        <section class="ltp-panel" id="ltp-preview-panel">
            <h2>Preview</h2>
            <pre id="ltp-preview-before"></pre>
            <pre id="ltp-preview-after"></pre>
            <pre id="ltp-preview-diff"></pre>
            <div class="ltp-preview-actions">
                <button id="ltp-apply" disabled>Apply</button>
                <button id="ltp-cancel" disabled>Cancel</button>
            </div>
        </section>
    </main>
    <section class="ltp-panel" id="ltp-summary-panel">
        <h2>Summary</h2>
        <pre id="ltp-summary"></pre>
    </section>
</div>
<script src="/static/ltp.js"></script>
</body>
</html>
