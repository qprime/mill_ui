[pytest]
testpaths =
    cortex
    continuum
    memories
    interfaces
    services
    skills
    tools
    vitals

addopts = -ra -q --strict-markers

markers =
    unit: fast unit tests, no network
    integration: cross-module tests, limited IO
    e2e: end-to-end or long-running flows
    api: calls external monetized APIs (e.g., OpenAI)
    network: requires network connectivity
    expensive: costly or slow to run
