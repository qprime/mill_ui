Sheet:
  width: 700mm
  height: 260mm
  thickness: 12mm
  material: mdf
children:
- Rect:
    id: five_petals
    at:
      x: 120mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Curve:
        type: rose
        lobes: 5
        depth: 0.3mm

- Rect:
    id: eight_petals_rotated
    at:
      x: 350mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Curve:
        type: rose
        lobes: 4
        depth: 0.3mm
        rotation: 22.5

- Circle:
    id: clipped_disc
    diameter: 200mm
    at:
      x: 580mm
      y: 130mm
      width: 200mm
      height: 200mm
    feature:
      type: profile
      side: outside
      depth: through
    children:
    - Curve:
        type: rose
        lobes: 3
        depth: 0.3mm
        size: 240mm
        min_length: 5mm
