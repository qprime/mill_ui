Sheet:
  width: 700mm
  height: 260mm
  thickness: 12mm
  material: mdf
children:
- Rect:
    id: nested
    at:
      x: 120mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Curve:
        type: spirograph
        depth: 0.3mm
        layers:
        - points: 7
          step: 3
          pen: [1.0, 0.8, 0.6, 0.4]

- Rect:
    id: swirl
    at:
      x: 350mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Curve:
        type: spirograph
        depth: 0.3mm
        layers:
        - points: 5
          step: 2
          pen: {from: 1.2, to: 0.4, count: 9}
          rotation_step: 4

- Rect:
    id: combined
    at:
      x: 580mm
      y: 130mm
      width: 200mm
      height: 200mm
    children:
    - Profile:
        side: outside
        depth: through
    - Curve:
        type: spirograph
        depth: 0.3mm
        layers:
        - points: 6
          step: 1
          mode: outside
          pen: 0.6
        - points: 12
          step: 5
          pen: 1.0
          depth: 0.5mm
