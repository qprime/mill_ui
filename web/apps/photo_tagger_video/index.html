<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Tagger</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Video Tagger">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
  <div class="container">
    <h1>🎥 Video Tagger</h1>
    <label for="videoInput" class="upload-label">Record or Upload a Video</label>
    <input type="file" accept="video/*" capture="environment" id="videoInput" />
    <input type="text" id="tagsInput" placeholder="Optional tags..." list="tagSuggestions" />
    <datalist id="tagSuggestions"></datalist>
    <button id="saveBtn">💾 Save Video Entry</button>
    <button id="exportBtn">📤 Export All</button>
    <ul id="entryList"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
