<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Cliff AI{% endblock %}</title>
  <link href="{{ url_for('static', filename='css/darkly.css') }}" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (document.querySelector("code[class^='language-']")) {
        hljs.highlightAll();
      }
    });
  </script>

  

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark text-light" data-chat-id="{{ chat_id | default('') }}" data-seed="{{ seed | default('') }}">
  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <a class="navbar-brand" href="/">Cliff AI</a>
        {% if ledger_status and ledger_status.needs_compaction %}
          <span class="badge bg-warning text-dark" title="Ledger size {{ ledger_status.size_mb }} MB exceeds {{ ledger_status.threshold_mb }} MB threshold. Consider compacting.">
            ⚠️ Ledger {{ ledger_status.size_mb }}MB
          </span>
        {% endif %}
      </div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/">🏠 Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/chat">💬 Chat</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/tasks">🧠 Tasks</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="py-4">
    <h1 class="mb-4">{% block header %}🧠 Cliff AI{% endblock %}</h1>
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
