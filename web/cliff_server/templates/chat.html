{% extends "base.html" %}
{% block title %}Cliff Chat{% endblock %}

{% block content %}


<div class="container-fluid vh-100 d-flex flex-row bg-dark text-light p-0" data-chat-id="{{ chat_id }}">
  <!-- Sidebar with voice + text controls -->
  <div class="d-flex flex-column bg-secondary p-3 gap-3" style="width: 200px; min-width: 200px; height: 100vh; overflow-y: auto; position: sticky; top: 0;">
    <div>
      <label for="personaSelector" class="form-label text-light">Persona</label>
      <select id="personaSelector" class="form-select form-select-sm">
        {% for persona in personas %}
          <option value="{{ persona }}" {% if persona == default_persona %}selected{% endif %}>{{ persona }}</option>
        {% endfor %}
      </select>
    </div>
    <div id="conversationActions" class="d-flex flex-column gap-2">
      <span class="fw-bold small text-light">Conversation Actions</span>
      <button type="button" class="btn btn-outline-info btn-sm promotion-btn" data-scope="conversation" data-action="ideate">Branch Ideation</button>
      <button type="button" class="btn btn-outline-warning btn-sm promotion-btn" data-scope="conversation" data-action="operate">Upgrade to Operation</button>
      <button type="button" class="btn btn-outline-primary btn-sm promotion-btn" data-scope="conversation" data-action="build">Upgrade to Build</button>
      <button type="button" class="btn btn-outline-success btn-sm promotion-btn" data-scope="conversation" data-action="task">Upgrade to Task</button>
      <button type="button" class="btn btn-outline-light btn-sm promotion-btn" data-scope="conversation" data-action="document">Upgrade to Document</button>
      <button type="button" class="btn btn-outline-secondary btn-sm promotion-btn" data-scope="conversation" data-action="chat">Convert to Chat</button>
    </div>
    <!-- Voice Button -->
    <button type="button" id="voiceBtn" class="btn btn-success">🎙️ Talk to Cliff</button>
    <div id="micStatus" class="text-info small">Idle</div>

    <!-- Toggle for text input -->
    <button id="toggleInput" class="btn btn-outline-light btn-sm">✏️ Enable Typing</button>

    <!-- Optional Text Input Form -->
    <div id="inputControls" class="d-none flex-column gap-2 mt-3">
      <input type="text" id="userInput" class="form-control" placeholder="Ask Cliff something...">
      <select id="toneSelector" class="form-select">
        <option value="neutral" selected>Neutral</option>
        <option value="emotional">Witty</option>
      </select>
      <button id="sendBtn" class="btn btn-primary">Send</button>
    </div>
  </div>

  <!-- Main Chat Display Area -->
  <div class="flex-grow-1 d-flex flex-column position-relative">
    <!-- Chat Output Container -->
    <div id="chatContainer" class="flex-grow-1 overflow-auto d-flex flex-column gap-3 p-3"
         style="min-height: 0; scroll-behavior: smooth;">
      <!-- Dynamic chat entries will render here -->
    </div>
    <!-- (Optional) Modal or footer controls can go here -->
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const chatContainer = document.getElementById("chatContainer");
  const userInput = document.getElementById("userInput");
  const toneSelector = document.getElementById("toneSelector");
  const sendBtn = document.getElementById("sendBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const toggleInput = document.getElementById("toggleInput");
  const inputControls = document.getElementById("inputControls");
  const micStatus = document.getElementById("micStatus");
  const personaSelector = document.getElementById("personaSelector");
  const chatId = document.body.dataset.chatId || "{{ chat_id }}";
  const seedText = document.body.dataset.seed || "";

  let recorder, chunks = [], recording = false;

  const TURN_PROMOTIONS = [
    { action: "ideate", label: "Branch Ideation" },
    { action: "operate", label: "Upgrade to Operation" },
    { action: "build", label: "Upgrade to Build" },
    { action: "task", label: "Upgrade to Task" },
    { action: "document", label: "Upgrade to Document" },
    { action: "chat", label: "Convert to Chat" },
  ];

  function setStatus(text, pulse = false, done = false) {
    if (!micStatus || !voiceBtn) return;
    micStatus.innerText = text;
    voiceBtn.classList.remove("pulse-processing", "btn-danger");
    voiceBtn.classList.add("btn-success");
    voiceBtn.innerText = "🎙️ Talk to Cliff";
    if (pulse) voiceBtn.classList.add("pulse-processing");
    if (done) voiceBtn.style.border = "2px solid lime";
  }

  if (toggleInput && inputControls && userInput) {
    toggleInput.onclick = () => {
      inputControls.classList.toggle("d-none");
      if (!inputControls.classList.contains("d-none")) {
        userInput.focus();
      }
    };
  }

  if (seedText && inputControls && userInput) {
    inputControls.classList.remove("d-none");
    userInput.value = seedText;
  }

  async function persistPersona(selected, { silent = false } = {}) {
    if (!selected || !chatId) return;
    try {
      localStorage.setItem(`cliff.chat.persona.${chatId}`, selected);
      await fetch("/persona", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: chatId, persona: selected })
      });
    } catch (err) {
      if (!silent) {
        console.error("Failed to persist persona", err);
      }
    }
  }

  async function loadPersonaFromServer() {
    if (!chatId || !personaSelector) return;
    try {
      const res = await fetch(`/persona/${chatId}`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.persona && data.persona !== personaSelector.value) {
        personaSelector.value = data.persona;
        localStorage.setItem(`cliff.chat.persona.${chatId}`, data.persona);
      }
    } catch (err) {
      console.warn("Unable to load persona", err);
    }
  }

  if (personaSelector) {
    personaSelector.addEventListener("change", () => {
      persistPersona(personaSelector.value);
    });
    const storedPersona = localStorage.getItem(`cliff.chat.persona.${chatId}`);
    if (storedPersona && storedPersona !== personaSelector.value) {
      personaSelector.value = storedPersona;
    }
    persistPersona(personaSelector.value, { silent: true });
    loadPersonaFromServer();
  }

  if (sendBtn && userInput && toneSelector) {
    sendBtn.onclick = () => {
      handleChatSubmission(userInput.value.trim(), toneSelector.value);
    };
    userInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleChatSubmission(userInput.value.trim(), toneSelector.value);
      }
    });
  }

  if (voiceBtn) {
    voiceBtn.onclick = async () => {
      if (recording) {
        recorder.stop();
        recording = false;
        voiceBtn.innerText = "🎙️ Talk to Cliff";
        voiceBtn.classList.remove("btn-danger");
        voiceBtn.classList.add("btn-success");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        chunks = [];
        recording = true;
        setStatus("Recording...", true);
        voiceBtn.innerText = "🛑 Stop Talking";
        voiceBtn.classList.remove("btn-success");
        voiceBtn.classList.add("btn-danger");
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          setStatus("Transcribing…", true);
          const blob = new Blob(chunks, { type: "audio/wav" });
          const formData = new FormData();
          formData.append("file", blob, "recording.wav");
          try {
            const res = await fetch("https://192.168.0.179:8001/transcribe", {
              method: "POST",
              body: formData,
              mode: "cors",
              credentials: "omit"
            });
            const data = await res.json();
            const text = data.text || "";
            if (text) {
              setStatus("Submitting to Cliff…", true);
              await handleChatSubmission(text, toneSelector ? toneSelector.value : "neutral");
              setStatus("Done.", false, true);
            } else {
              setStatus("No speech detected", false);
            }
          } catch (err) {
            console.error("Whisper error:", err);
            setStatus("Error during transcription", false);
          }
        };
        recorder.start();
      } catch (err) {
        console.error("Microphone error:", err);
        setStatus("Mic error", false);
      }
    };
  }

  async function handleChatSubmission(prompt, tone) {
    if (!prompt) return;
    const persona = personaSelector ? personaSelector.value : "{{ default_persona }}";
    const timestamp = new Date().toISOString();
    const exchange = document.createElement("div");
    exchange.className = "card p-3 bg-dark text-light shadow-sm fade-in";
    exchange.dataset.persona = persona;
    exchange.dataset.turnId = "";
    exchange.dataset.userInput = prompt;
    exchange.dataset.distilled = "";
    exchange.dataset.response = "";
    exchange.dataset.model = "";

    exchange.innerHTML = `
      <div class="d-flex flex-column flex-md-row gap-3">
        <div class="flex-fill">
          <strong class="text-info">🧑 You:</strong>
          <div class="toggle-original-distilled mb-2">
            <p class="user-original">${prompt}</p>
            <p class="user-distilled d-none text-info fst-italic">(Distilled loading...)</p>
            <button class="btn btn-sm btn-outline-secondary toggle-distill-btn">Toggle Distilled</button>
          </div>
        </div>
        <div class="flex-fill">
          <strong class="text-warning">🤖 Cliff:</strong>
          <p id="cliff-${timestamp}" class="text-muted mb-2 fst-italic">Thinking...</p>
          <div class="text-end text-muted small" id="model-${timestamp}"></div>
        </div>
      </div>`;
    chatContainer.prepend(exchange);
    renderTurnActions(exchange);
    if (userInput) userInput.value = "";

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, tone, chat_id: chatId, persona })
      });
      const data = await response.json();
      const cliffResponse = document.getElementById(`cliff-${timestamp}`);
      const modelTag = document.getElementById(`model-${timestamp}`);
      const toggleBlock = exchange.querySelector(".toggle-original-distilled");
      if (toggleBlock) {
        const distilledEl = toggleBlock.querySelector(".user-distilled");
        distilledEl.innerText = `(Distilled) ${data.distilled_input || "N/A"}`;
        toggleBlock.querySelector(".toggle-distill-btn").onclick = () => {
          toggleBlock.querySelector(".user-original").classList.toggle("d-none");
          toggleBlock.querySelector(".user-distilled").classList.toggle("d-none");
        };
      }
      exchange.dataset.turnId = data.turn_memory_id || "";
      exchange.dataset.distilled = data.distilled_input || "";
      exchange.dataset.response = data.response || "";
      exchange.dataset.model = data.model || "";

      if (cliffResponse) {
        cliffResponse.innerHTML = formatCodeBlocks(data.response || "(No response)");
        cliffResponse.classList.remove("fst-italic", "text-muted");
        cliffResponse.querySelectorAll("pre code").forEach(block => {
          if (window.hljs) hljs.highlightElement(block);
        });
      }

      if (modelTag) {
        const metrics = data.metrics || {};
        modelTag.innerText = `Model: ${data.model || "unknown"}  🕒 ${metrics.latency_ms || ""}ms 🔼 ${metrics.tokens_in || 0} 🔽 ${metrics.tokens_out || 0}`;
      }
    } catch (err) {
      console.error("Ask error:", err);
      const cliffResponse = document.getElementById(`cliff-${timestamp}`);
      if (cliffResponse) cliffResponse.innerText = "(Error contacting Cliff)";
    }
  }

  function renderTurnActions(card) {
    const footer = document.createElement("div");
    footer.className = "d-flex flex-wrap gap-1 mt-3 promotion-turn-controls";
    TURN_PROMOTIONS.forEach(action => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-outline-info btn-sm promotion-btn";
      btn.dataset.scope = "turn";
      btn.dataset.action = action.action;
      btn.textContent = action.label;
      footer.appendChild(btn);
    });
    card.appendChild(footer);
  }

  async function handlePromotion({ button, scope, action }) {
    const persona = personaSelector ? personaSelector.value : "{{ default_persona }}";
    const payload = {
      chat_id: chatId,
      persona,
      action,
      scope,
    };

    let targetCard = null;
    if (scope === "turn") {
      targetCard = button.closest(".card[data-turn-id]");
      if (!targetCard) {
        displayPromotionResult(action, scope, { error: "Unable to locate chat turn." });
        return;
      }
      const turnId = targetCard.dataset.turnId || "";
      if (turnId) {
        payload.turn_id = turnId;
      }
      payload.turn_fallback = {
        turn_id: turnId || null,
        user_input: targetCard.dataset.userInput || "",
        response: targetCard.dataset.response || "",
        distilled: targetCard.dataset.distilled || "",
        persona: targetCard.dataset.persona || persona,
        model: targetCard.dataset.model || "",
      };
    } else {
      const cards = Array.from(chatContainer.querySelectorAll('.card[data-turn-id]')).reverse();
      payload.turn_ids = cards.map(card => card.dataset.turnId).filter(Boolean);
      payload.turn_fallbacks = cards.map(card => ({
        turn_id: card.dataset.turnId || null,
        user_input: card.dataset.userInput || "",
        response: card.dataset.response || "",
        distilled: card.dataset.distilled || "",
        persona: card.dataset.persona || persona,
        model: card.dataset.model || "",
      }));
    }

    button.disabled = true;
    const originalLabel = button.textContent;
    button.textContent = "Working…";

    try {
      const res = await fetch("/promote", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        displayPromotionResult(action, scope, { error: data.error || "Promotion failed." });
      } else {
        if (data.kind === "chat" && data.new_chat_url) {
          window.open(data.new_chat_url, "_blank");
        }
        displayPromotionResult(action, scope, data);
      }
    } catch (err) {
      console.error("Promotion error", err);
      displayPromotionResult(action, scope, { error: String(err) });
    } finally {
      button.disabled = false;
      button.textContent = originalLabel;
    }
  }

  function displayPromotionResult(action, scope, data) {
    const card = document.createElement("div");
    const hasError = Boolean(data.error);
    card.className = `card mt-3 ${hasError ? 'border-danger' : 'border-info'} bg-dark text-light`;
    const heading = `${action.replace(/_/g, ' ')} (${scope})`;
    let body = "";
    if (hasError) {
      body = `<p class="mb-0 text-danger">${data.error}</p>`;
    } else if (data.kind === "run") {
      body = `<p class="mb-0">Started run <code>${data.run.id}</code></p>`;
    } else if (data.kind === "action") {
      body = `<p class="mb-0">Created action <code>${data.action_id}</code> with brief <code>${data.brief_id}</code></p>`;
    } else if (data.kind === "task") {
      body = `<p class="mb-0">Created task <code>${data.task.id}</code></p>`;
    } else if (data.kind === "document") {
      body = `<p class="mb-0">Created document <code>${data.slug}</code></p>`;
    } else if (data.kind === "chat") {
      body = `<p class="mb-0">Created new chat session <code>${data.new_chat_id}</code></p>`;
    } else {
      body = `<p class="mb-0">${data.message || "Promotion completed."}</p>`;
    }
    card.innerHTML = `<div class="card-body"><strong>${heading}</strong><div class="mt-2">${body}</div></div>`;
    chatContainer.prepend(card);
  }

  document.addEventListener("click", event => {
    const btn = event.target.closest(".promotion-btn");
    if (!btn) return;
    event.preventDefault();
    if (btn.disabled) return;
    handlePromotion({ button: btn, scope: btn.dataset.scope || "turn", action: btn.dataset.action });
  });

  function formatCodeBlocks(text) {
    const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
    return text.replace(codeBlockRegex, (_, lang, code) => {
      const language = (lang || "bash").toLowerCase();
      return `
        <div class="cli-wrapper border rounded bg-black text-light position-relative mt-2 mb-3 p-2">
          <pre class="m-0"><code class="language-${language}">${code}</code></pre>
          <div class="btn-group btn-group-sm position-absolute top-0 end-0 m-1">
            <button class="btn btn-outline-light btn-copy">Copy</button>
            <button class="btn btn-outline-success btn-run">Run</button>
          </div>
        </div>
      `;
    });
  }
});
</script>

<style>
.fade-in {
  animation: fadeIn 0.4s ease-in;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.pulse-processing {
  animation: pulse-yellow 2s infinite;
  border: 2px solid yellow;
}
@keyframes pulse-yellow {
  0% { border-color: yellow; box-shadow: 0 0 5px yellow; }
  50% { border-color: gold; box-shadow: 0 0 15px gold; }
  100% { border-color: yellow; box-shadow: 0 0 5px yellow; }
}
.cli-wrapper {
  font-family: "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 0.875rem;
  background-color: #1e1e1e;
  border: 1px solid #333;
  border-radius: 6px;
}
.cli-wrapper pre {
  white-space: pre-wrap;
  word-wrap: break-word;
}
</style>

<!-- Output Modal -->
<div class="modal fade" id="outputModal" tabindex="-1" aria-labelledby="outputModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header">
        <h5 class="modal-title" id="outputModalLabel">Command Output</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <pre><code id="outputStdout" class="text-success"></code></pre>
        <pre><code id="outputStderr" class="text-warning"></code></pre>
        <div id="outputCode" class="text-muted small"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
