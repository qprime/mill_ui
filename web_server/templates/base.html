<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Cliff AI{% endblock %}</title>
  <link href="{{ url_for('static', filename='css/darkly.css') }}" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Cliff AI</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/">🏠 Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/chat">💬 Chat</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/tasks">🧠 Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/chatlog">🗂️ Chat Log</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="py-4">
    <h1 class="mb-4">{% block header %}🧠 Cliff AI{% endblock %}</h1>
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
