<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSONL Review Tool</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">JSONL Review Tool</h1>
    <div class="mb-3">
      <label for="jsonlFile" class="form-label">Select a .jsonl file</label>
      <input class="form-control" type="file" id="jsonlFile" accept=".jsonl">
    </div>

    <table class="table table-bordered table-hover" id="jsonTable">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Date</th>
          <th>Preview</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Entry</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle">
            </div>
            <div class="mb-3">
              <label for="editSource" class="form-label">Source</label>
              <input type="text" class="form-control" id="editSource">
            </div>
            <div class="mb-3">
              <label for="editTimestamp" class="form-label">Timestamp</label>
              <input type="text" class="form-control" id="editTimestamp">
            </div>
            <div class="mb-3">
              <label for="editTopics" class="form-label">Topics</label>
              <input type="text" class="form-control" id="editTopics">
            </div>
            <div class="mb-3">
              <label for="editCleanedText" class="form-label">Cleaned Text</label>
              <textarea class="form-control" id="editCleanedText" rows="10"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" id="prevEntry">Back</button>
          <button type="button" class="btn btn-outline-secondary" id="nextEntry">Next</button>
          <button type="button" class="btn btn-secondary" id="closeEditor">Close</button>
          <button type="button" class="btn btn-primary" id="saveChanges">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let entries = [];
    let currentIndex = null;

    document.getElementById('jsonlFile').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      localStorage.setItem('lastJsonlFile', file.name);
      loadJsonl(file);
    });

    function autoLoadLastFile() {
      const input = document.getElementById('jsonlFile');
      const fileList = input.files;
      if (fileList.length > 0) {
        loadJsonl(fileList[0]);
      }
    }

    async function loadJsonl(file) {
      const text = await file.text();
      entries = text.split('\n')
        .filter(line => line.trim())
        .map(line => {
          try {
            return JSON.parse(line);
          } catch (e) {
            return { title: 'Invalid JSON', cleaned_text: line };
          }
        });
      renderTable();
    }

    function renderTable() {
      const tbody = document.querySelector('#jsonTable tbody');
      tbody.innerHTML = '';
      entries.forEach((entry, idx) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${idx + 1}</td>
          <td>${entry.title || '(No title)'}</td>
          <td>${formatDate(entry.timestamp)}</td>
          <td>${(entry.cleaned_text || '').slice(0, 80)}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" onclick="openEditor(${idx})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteEntry(${idx})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function formatDate(timestamp) {
      if (!timestamp) return '(No date)';
      try {
        const d = new Date(timestamp);
        return isNaN(d) ? '(Invalid date)' : d.toLocaleDateString();
      } catch {
        return '(Invalid date)';
      }
    }

    function openEditor(idx) {
      currentIndex = idx;
      const entry = entries[idx];
      document.getElementById('editTitle').value = entry.title || '';
      document.getElementById('editSource').value = entry.source || '';
      document.getElementById('editTimestamp').value = entry.timestamp || '';
      document.getElementById('editTopics').value = entry.topics || '';
      document.getElementById('editCleanedText').value = entry.cleaned_text || '';
      new bootstrap.Modal(document.getElementById('editModal')).show();
    }

    document.getElementById('saveChanges').addEventListener('click', () => {
      saveEdit();
    });

    document.getElementById('closeEditor').addEventListener('click', () => {
      bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    });

    document.getElementById('nextEntry').addEventListener('click', () => {
      saveEdit();
      if (currentIndex < entries.length - 1) openEditor(currentIndex + 1);
    });

    document.getElementById('prevEntry').addEventListener('click', () => {
      saveEdit();
      if (currentIndex > 0) openEditor(currentIndex - 1);
    });

    function saveEdit() {
      entries[currentIndex] = {
        title: document.getElementById('editTitle').value,
        source: document.getElementById('editSource').value,
        timestamp: document.getElementById('editTimestamp').value,
        topics: document.getElementById('editTopics').value,
        cleaned_text: document.getElementById('editCleanedText').value
      };
      renderTable();
      bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    }

    function deleteEntry(idx) {
      if (confirm('Are you sure you want to delete this entry?')) {
        entries.splice(idx, 1);
        renderTable();
      }
    }

    window.addEventListener('load', autoLoadLastFile);
  </script>
</body>
</html>
