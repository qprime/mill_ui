<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create New Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">📝 Create New Task</h1>

    <form method="POST" action="/tasks/create">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" name="title" required>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
      </div>

      <div class="mb-3">
        <label for="tags" class="form-label">Tags (comma-separated)</label>
        <input type="text" class="form-control" id="tags" name="tags">
      </div>

      <div class="mb-3">
        <label for="files" class="form-label">Files (comma-separated paths)</label>
        <input type="text" class="form-control" id="files" name="files">
      </div>

      <div class="mb-3">
        <label for="steps" class="form-label">Steps (one per line)</label>
        <textarea class="form-control" id="steps" name="steps" rows="4"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Create Task</button>
      <a href="/tasks" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>
</body>
</html>{% extends "base.html" %}
