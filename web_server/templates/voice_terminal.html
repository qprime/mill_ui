{% extends "base.html" %}
{% block title %}CLIFF Voice Terminal{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="mb-4">🎙️ CLIFF Voice Terminal</h1>

  <button id="autoTalkButton" class="btn btn-success">🗣️ Talk to Cliff</button>

  <input type="file" id="audioFile" accept=".wav,.mp3" class="form-control mt-3" />
  <p id="status" class="mt-3">Status: Idle</p>

  <h2 class="mt-4">Transcription:</h2>
  <p id="transcript" class="bg-secondary p-2 rounded">...</p>
  <p id="metrics" class="text-muted small">⏱️ Duration: N/A | 🧮 Words: N/A</p>

  <h2 class="mt-4">Mistral LLM Response:</h2>
  <p id="llmResponse" class="bg-dark p-2 rounded">...</p>

  <script>
  let mediaRecorder;
  let audioChunks = [];
  let recording = false;

  const autoTalkButton = document.getElementById("autoTalkButton");
  const status = document.getElementById("status");
  const transcript = document.getElementById("transcript");
  const llmResponse = document.getElementById("llmResponse");
  const metrics = document.getElementById("metrics");

  const audioPlayer = document.createElement("audio");
  audioPlayer.controls = true;
  document.body.appendChild(audioPlayer);

  autoTalkButton.onclick = async () => {
    if (!recording) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

      mediaRecorder.onstop = async () => {
        status.innerText = "Status: Processing...";
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        const formData = new FormData();
        formData.append('file', audioBlob, 'recording.wav');
        await transcribeAndSpeak(formData);
      };

      mediaRecorder.start();
      recording = true;
      autoTalkButton.innerText = "🛑 Stop and Respond";
      status.innerText = "Status: Recording...";
    } else {
      mediaRecorder.stop();
      recording = false;
      autoTalkButton.innerText = "🗣️ Talk to Cliff";
      status.innerText = "Status: Uploading...";
    }
  };

  async function transcribeAndSpeak(formData) {
    const start = performance.now();

    try {
      const whisperStart = performance.now();
      const response = await fetch("https://192.168.0.179:8001/transcribe", {
        method: "POST",
        body: formData,
      });
      const result = await response.json();
      const whisperEnd = performance.now();

      const text = result.text;
      transcript.innerText = text;

      const ttsStart = performance.now();
      const ttsResponse = await fetch("/voice/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const ttsEnd = performance.now();

      const audioBlob = await ttsResponse.blob();
      const audioURL = URL.createObjectURL(audioBlob);
      audioPlayer.src = audioURL;
      audioPlayer.play();

      const wordCount = text.trim().split(/\s+/).length;
      const transcriptionTime = ((whisperEnd - whisperStart) / 1000).toFixed(2);
      const ttsTime = ((ttsEnd - ttsStart) / 1000).toFixed(2);
      const totalTime = ((ttsEnd - start) / 1000).toFixed(2);

      metrics.innerText = `⏱️ STT: ${transcriptionTime}s | 🔈 TTS: ${ttsTime}s | 🔁 Total: ${totalTime}s | 🧮 Words: ${wordCount}`;
      status.innerText = "Status: Playback complete.";
      llmResponse.innerText = "[LLM disabled — echoing transcript]";
    } catch (err) {
      console.error("Transcription or TTS error:", err);
      status.innerText = `Status: Error - ${err.message}`;
    }
  }
</script>


</div>
{% endblock %}
