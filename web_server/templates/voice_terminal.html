<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIFF Voice Terminal</title>
  <link href="/static/css/darkly.css" rel="stylesheet">

</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Cliff AI</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/">🏠 Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/chat">💬 Chat</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/tasks">🧠 Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/chatlog">🗂️ Chat Log</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h1 class="mb-4">🧠 Cliff AI</h1>

<style>
  @keyframes pulse-yellow {
    0% { border-color: yellow; box-shadow: 0 0 5px yellow; }
    50% { border-color: gold; box-shadow: 0 0 15px gold; }
    100% { border-color: yellow; box-shadow: 0 0 5px yellow; }
  }

  .pulse-processing {
    animation: pulse-yellow 2s infinite;
    border: 2px solid yellow;
  }
</style>

<div class="container py-5">
  <h1 class="mb-4">🧠 Cliff AI</h1>
  <h2 class="mb-4">🎙️ CLIFF Voice Terminal</h2>

<button id="autoTalkButton" class="btn btn-success mb-4">🗣️ Talk to Cliff</button>

  <div class="mb-4">
    <label for="audioFile" class="form-label">Upload Audio File (optional):</label>
    <input type="file" id="audioFile" accept=".wav,.mp3" class="form-control" />
  </div>

  <p id="status" class="mb-4 text-info">Status: Idle</p>

  <div class="card bg-dark text-light p-3 mb-3">
    <h5>🗣️ Speech Input</h5>
    <p id="transcript" class="bg-secondary p-2 rounded">...</p>
  </div>

  <div class="text-center">⬇️</div>

  <div class="card bg-dark text-light p-3 mb-3">
    <h5>🤖 AI Response</h5>
    <p id="llmResponse" class="bg-secondary p-2 rounded">[LLM disabled — echoing transcript]</p>
  </div>

  <div class="text-center">⬇️</div>

  <div class="card bg-dark text-light p-3 mb-3">
    <h5>🔈 Voice Output</h5>
    <audio id="audioPlayer" controls class="w-100"></audio>
  </div>

  <p id="metrics" class="text-muted small">⏱️ STT: N/A | 🤖 LLM: N/A | 🔈 TTS: N/A | 🔁 Total: N/A | 🧮 Words: N/A</p>
</div>

<script>
  let mediaRecorder;
  let audioChunks = [];
  let recording = false;

  const autoTalkButton = document.getElementById("autoTalkButton");
  const status = document.getElementById("status");
  const transcript = document.getElementById("transcript");
  const llmResponse = document.getElementById("llmResponse");
  const metrics = document.getElementById("metrics");
  const audioPlayer = document.getElementById("audioPlayer");
  const fileInput = document.getElementById("audioFile");

  function highlight(element, color) {
    element.classList.remove("pulse-processing");
    element.style.border = `2px solid ${color}`;
  }

  function pulse(element) {
    element.classList.add("pulse-processing");
  }

  function clearHighlights() {
    [transcript, llmResponse].forEach(el => {
      el.classList.remove("pulse-processing");
      highlight(el, "transparent");
    });
  }

  autoTalkButton.onclick = async () => {
    if (!recording) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

      mediaRecorder.onstop = async () => {
        status.innerText = "Status: Processing...";
        clearHighlights();
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        const formData = new FormData();
        formData.append('file', audioBlob, 'recording.wav');
        await transcribeAndSpeak(formData);
      };

      mediaRecorder.start();
      recording = true;
      autoTalkButton.innerText = "🛑 Stop and Respond";
      status.innerText = "Status: Recording...";
    } else {
      mediaRecorder.stop();
      recording = false;
      autoTalkButton.innerText = "🗣️ Talk to Cliff";
      status.innerText = "Status: Uploading...";
    }
  };

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append("file", file);
    await transcribeAndSpeak(formData);
  });

  async function transcribeAndSpeak(formData) {
    const start = performance.now();
    try {
      pulse(transcript);
      status.innerText = "Status: Transcribing...";
      const whisperStart = performance.now();
      const response = await fetch("https://192.168.0.179:8001/transcribe", {
        method: "POST",
        body: formData,
      });
      const result = await response.json();
      const whisperEnd = performance.now();

      const text = result.text;
      transcript.innerText = text;
      highlight(transcript, "lime");

      pulse(llmResponse);
      status.innerText = "Status: Waiting for LLM...";
      const llmStart = performance.now();
      const llm = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: text })
      });
      const llmResult = await llm.json();
      const llmText = llmResult.response || "[LLM Error or empty response]";
      const llmEnd = performance.now();
      llmResponse.innerText = llmText;
      highlight(llmResponse, "lime");

      status.innerText = "Status: Generating Speech...";
      const ttsStart = performance.now();
      const ttsResponse = await fetch("/voice/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: llmText }),
      });
      const ttsEnd = performance.now();

      const audioBlob = await ttsResponse.blob();
      const audioURL = URL.createObjectURL(audioBlob);
      audioPlayer.src = audioURL;
      audioPlayer.play();

      const wordCount = llmText.trim().split(/\s+/).length;
      const transcriptionTime = ((whisperEnd - whisperStart) / 1000).toFixed(2);
      const llmTime = ((llmEnd - llmStart) / 1000).toFixed(2);
      const ttsTime = ((ttsEnd - ttsStart) / 1000).toFixed(2);
      const totalTime = ((ttsEnd - start) / 1000).toFixed(2);

      metrics.innerText = `⏱️ STT: ${transcriptionTime}s | 🤖 LLM: ${llmTime}s | 🔈 TTS: ${ttsTime}s | 🔁 Total: ${totalTime}s | 🧮 Words: ${wordCount}`;
      status.innerText = "Status: Playback complete.";
    } catch (err) {
      console.error("Transcription or TTS error:", err);
      status.innerText = `Status: Error - ${err.message}`;
    }
  }
</script>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
